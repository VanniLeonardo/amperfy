# Fork only: builds an unsigned IPA of a branch for sideloading (SideStore signs it on the phone).
# Run: gh workflow run build-ipa.yml -f ref=leomusique
name: Build unsigned IPA
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to build
        default: leomusique
      tests:
        description: Test classes of AmperfyKitTests to run (space separated)
        default: ListenReporterTest PlayQueueHandlerTest MusicPlayerTest
jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Unit tests on an iPhone simulator
        run: |
          set -o pipefail
          udid=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k in sorted(d, reverse=True) if "iOS" in k for x in d[k] if "iPhone" in x["name"]))')
          xcrun simctl list devices available | grep "$udid"
          xcodebuild test -project Amperfy.xcodeproj -scheme Amperfy -destination "id=$udid" \
            -derivedDataPath build-test -skipPackagePluginValidation -skipMacroValidation CODE_SIGNING_ALLOWED=NO \
            $(for t in ${{ inputs.tests }}; do printf -- '-only-testing:AmperfyKitTests/%s ' "$t"; done) \
            2>&1 | tee test.log | grep -E "error:|Test Case .* (passed|failed)|Executed|TEST (SUCCEEDED|FAILED)|\*\* " || true
          grep -q "TEST SUCCEEDED" test.log
      - name: What the project's formatter changed
        if: always()
        run: git diff > format.patch; git diff --stat | tail -5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-log
          path: |
            test.log
            format.patch
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Build
        run: |
          xcodebuild -version
          set -o pipefail
          xcodebuild -project Amperfy.xcodeproj -scheme Amperfy -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error|warning: unre|BUILD|^\*\*" || true
          test -d build/Build/Products/Release-iphoneos/Amperfy.app
      - name: Package
        run: |
          app=build/Build/Products/Release-iphoneos/Amperfy.app
          # Own name on the home screen, so it can sit next to the App Store version
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string LeoMusique" "$app/Info.plist"
          mkdir Payload && cp -R "$app" Payload/
          zip -qry LeoMusique.ipa Payload
          ls -lh LeoMusique.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: LeoMusique
          path: LeoMusique.ipa
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
